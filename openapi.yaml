{
  "openapi": "3.1.0",
  "info": {
    "title": "Cross-Team PDF Comparison Interface",
    "description": "Client of the shared pod v0.3.0 contract. Runs setup, catalog/health checks, one uploaded-file request, and coverage lookup; this is not a complete acceptance test suite.",
    "version": "0.3.0"
  },
  "paths": {
    "/health": {
      "get": {
        "summary": "Health",
        "operationId": "health_health_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
    "/api/compare": {
      "post": {
        "summary": "Compare Teams",
        "operationId": "compare_teams_api_compare_post",
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/Body_compare_teams_api_compare_post"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": true,
                  "type": "object",
                  "title": "Response Compare Teams Api Compare Post"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/team3/process": {
      "post": {
        "summary": "Process With Team3",
        "operationId": "process_with_team3_api_team3_process_post",
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/Body_process_with_team3_api_team3_process_post"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response"
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/api/review-download": {
      "post": {
        "summary": "Review Download",
        "description": "Package the exact displayed result; never re-run either team's processing.",
        "operationId": "review_download_api_review_download_post",
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/Body_review_download_api_review_download_post"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response"
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Body_compare_teams_api_compare_post": {
        "properties": {
          "file": {
            "type": "string",
            "format": "binary",
            "title": "File"
          },
          "team_a_url": {
            "type": "string",
            "title": "Team A Url"
          },
          "team_b_url": {
            "type": "string",
            "title": "Team B Url"
          }
        },
        "type": "object",
        "required": [
          "file",
          "team_a_url",
          "team_b_url"
        ],
        "title": "Body_compare_teams_api_compare_post"
      },
      "Body_process_with_team3_api_team3_process_post": {
        "properties": {
          "file": {
            "type": "string",
            "format": "binary",
            "title": "File"
          }
        },
        "type": "object",
        "required": [
          "file"
        ],
        "title": "Body_process_with_team3_api_team3_process_post"
      },
      "Body_review_download_api_review_download_post": {
        "properties": {
          "file": {
            "type": "string",
            "format": "binary",
            "title": "File"
          },
          "report": {
            "type": "string",
            "format": "binary",
            "title": "Report"
          }
        },
        "type": "object",
        "required": [
          "file",
          "report"
        ],
        "title": "Body_review_download_api_review_download_post"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
