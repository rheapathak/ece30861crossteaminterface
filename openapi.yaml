openapi: 3.0.3
info:
  title: Cross-Team File Processing Interface
  version: 0.1.0
  description: >-
    Minimal contract for a team implementation that accepts a file and returns
    JSON output in a standard structure for black-box comparison.
servers:
  - url: https://example-team-api.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: healthy

  /process:
    post:
      summary: Process an uploaded file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingResult'
        '400':
          description: Invalid file or malformed request
        '401':
          description: Unauthorized
        '500':
          description: Processing error

components:
  schemas:
    ProcessingResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [success, error]
          example: success
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionResult'
        processing_time_ms:
          type: integer
          example: 1234
        message:
          type: string
          example: Document processed successfully

    ExtractionResult:
      type: object
      required: [field, value]
      properties:
        field:
          type: string
          example: invoice_number
        value:
          type: string
          example: INV-12345
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.97
