<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cross-Team PDF Comparison</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
        margin: 0;
        padding: 24px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input[type="text"], input[type="file"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        box-sizing: border-box;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover {
        background: #1d4ed8;
      }
      .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 24px;
      }
      .card {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px;
      }
      .card h3 {
        margin-top: 0;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #111827;
        color: #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
      }
      .status {
        font-weight: 700;
        margin-top: 12px;
      }
      .status.success {
        color: #15803d;
      }
      .status.error {
        color: #b91c1c;
      }
      @media (max-width: 700px) {
        .grid, .result-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cross-Team PDF Comparison</h1>

      <form id="compare-form">
        <div class="grid">
          <div>
            <label for="teamAUrl">Team A base URL</label>
            <input id="teamAUrl" name="team_a_url" type="text" placeholder="https://team-a.example.com" value="" />
          </div>
          <div>
            <label for="teamBUrl">Team B base URL</label>
            <input id="teamBUrl" name="team_b_url" type="text" placeholder="https://team-b.example.com" value="" />
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label for="pdfFile">Upload PDF</label>
          <input id="pdfFile" name="file" type="file" accept="application/pdf" required />
        </div>

        <button type="submit">Run comparison</button>
      </form>

      <div id="message" class="status" style="display:none;"></div>

      <div class="result-grid">
        <div class="card">
          <h3>Team A response</h3>
          <pre id="teamAOutput">Waiting for test...</pre>
        </div>
        <div class="card">
          <h3>Team B response</h3>
          <pre id="teamBOutput">Waiting for test...</pre>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
